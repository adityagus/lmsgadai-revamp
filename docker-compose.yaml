services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lmsgadai-revamp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-${APP_PORT:-8002}}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "${DOCKER_APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://beladiri.gadaimulia.com}"
      APP_KEY: "${APP_KEY:?Isi APP_KEY di .env dengan key aplikasi yang sudah ada}"
      DB_HOST: "${DOCKER_DB_HOST:-${DB_HOST:-host.docker.internal}}"
      DB2_HOST: "${DOCKER_DB2_HOST:-${DB2_HOST:-host.docker.internal}}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      LOG_CHANNEL: stderr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime:/var/www/html/storage

volumes:
  runtime:
